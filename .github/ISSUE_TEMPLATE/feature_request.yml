name: Feature request
description: Suggest a change before writing code.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: The four rules in CONTRIBUTING.md still apply. Zero dependencies, verbatim quotes, simulated things say so, and a conversation as the front door.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What you would change
